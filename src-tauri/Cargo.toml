[package]
name = "jaw-reminders"
version = "0.1.0"
description = "Fast local reminders for CLI-JAW workflows"
authors = ["Jun"]
edition = "2021"

[lib]
name = "jaw_reminders_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_with = "3"
serde_json = "1"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-notification = "2.3.3"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
